services:
  db:
    image: 'postgres:15'
    container_name: postgres_cinema
    env_file:
      - envs/.env.prod
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_cinema_data:/var/lib/postgresql/data/
    networks:
      - cinema_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_cinema
    ports:
      - "3333:80"
    env_file:
      - envs/.env.prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_cinema_data:/var/lib/pgadmin
    networks:
      - cinema_network

  web:
    restart: always
    build: .
    container_name: backend_cinema
    command: [ "/bin/bash", "/commands/run_web_server_prod.sh" ]
    env_file:
      - envs/.env.prod
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/usr/src/fastapi
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - ./src:/usr/src/fastapi
    networks:
      - cinema_network

  mailhog:
    restart: always
    build:
      context: .
      dockerfile: ./docker/mailhog/Dockerfile
    container_name: mailhog_cinema
    command: ["/bin/bash", "-c", "/commands/setup_mailhog_auth.sh && /go/bin/MailHog"]
    ports:
      - "8025:8025"
      - "1025:1025"
    env_file:
      - envs/.env.prod
    environment:
      MH_AUTH_FILE: /mailhog.auth
    networks:
      - cinema_network

  migrator:
    build: .
    container_name: alembic_migrator_cinema
    command: ["/bin/bash", "/commands/run_migration.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/fastapi
    env_file:
      - envs/.env.prod
    environment:
      - PYTHONPATH=/usr/src/fastapi
    networks:
      - cinema_network

  minio:
    image: minio/minio:latest
    container_name: minio-cinema
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - envs/.env.prod
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema_network

  minio_mc:
    build:
      context: .
      dockerfile: docker/minio_cm/Dockerfile
    container_name: minio_mc_cinema
    command: ["bin/sh", "-c", "/commands/setup_minio.sh"]
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - envs/.env.prod
    networks:
      - cinema_network

  redis:
    image: redis:latest
    container_name: redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/usr/redis/data
    networks:
      - cinema_network

  celery_worker:
    build: .
    container_name: cinema_celery_worker
    command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info"]
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/usr/src/fastapi
    env_file:
      - envs/.env.prod
    environment:
      - PYTHONPATH=/usr/src/fastapi
    networks:
      - cinema_network

  celery_beat:
    build: .
    container_name: cinema_celery_beat
    command: ["celery", "-A", "tasks.celery_app", "beat", "--loglevel=info"]
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/usr/src/fastapi
    env_file:
      - envs/.env.prod
    environment:
      - PYTHONPATH=/usr/src/fastapi
    networks:
      - cinema_network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: nginx
    restart: always
    env_file:
      - envs/.env.prod
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cinema_network

volumes:
  postgres_cinema_data:
    driver: local
  pgadmin_cinema_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  cinema_network:
    driver: bridge
