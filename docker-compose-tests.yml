services:
  web:
    restart: always
    build:
      context: .
      dockerfile: ./docker/tests/Dockerfile
    container_name: backend_cinema_test
    command: ["pytest", "-c", "/usr/src/config/pytest.ini",
              "-m", "e2e", "--maxfail=5", "--disable-warnings", "-v", "--tb=short"]
    environment:
      - PYTHONPATH=/usr/src/fastapi
    ports:
      - "8000:8000"
    depends_on:
      mailhog:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/fastapi
    networks:
      - cinema_network_test

  mailhog:
    restart: always
    build:
      context: .
      dockerfile: ./docker/mailhog/Dockerfile
    container_name: mailhog_cinema_test
    ports:
      - "8025:8025"
      - "1025:1025"
    env_file:
      - ./envs/.env.tests
    networks:
      - cinema_network_test

  minio:
    image: minio/minio:latest
    container_name: minio_cinema_test
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_test:/data
    env_file:
      - ./envs/.env.tests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema_network_test

  minio_mc:
    build:
      context: .
      dockerfile: docker/minio_cm/Dockerfile
    container_name: minio_mc_cinema_test
    command: ["bin/sh", "-c", "/commands/setup_minio.sh"]
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./envs/.env.tests
    networks:
      - cinema_network_test

volumes:
  minio_data_test:
    driver: local

networks:
  cinema_network_test:
    driver: bridge
